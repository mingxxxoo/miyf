# www.miyf.cn HTTPS（启用前须有证书文件）
# 证书路径（宿主机）：/miyf/data/nginx/certs/fullchain.pem、privkey.pem
# 启用步骤见 deploy/README.md §9

upstream miyf_api_https {
    server server:8080;
    keepalive 16;
}

upstream miyf_minio_https {
    server minio:9000;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.miyf.cn miyf.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://miyf_api_https;
    }

    location /actuator/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://miyf_api_https;
    }

    location /media/ {
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_pass http://miyf_minio_https/miyf/;
    }

    location /swagger-ui/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://miyf_api_https;
    }

    location /v3/api-docs {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://miyf_api_https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTP → HTTPS（保留 /.well-known 便于续签证书）
server {
    listen 80;
    server_name www.miyf.cn miyf.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.miyf.cn$request_uri;
    }
}
