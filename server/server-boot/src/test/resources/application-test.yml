spring:
  main:
    allow-bean-definition-overriding: true

wx:
  auth:
    mock-enabled: true

app:
  health:
    huawei:
      mock-enabled: true
  file-storage:
    type: local
    path: ${java.io.tmpdir}/miyf-it-uploads
    base-url: http://localhost:8080
    public-read: false
    access-sign-secret: unit-test-file-access-sign-secret-32!
  redis:
    enabled: true
    rate-limit:
      enabled: false

logging:
  level:
    root: WARN
    cn.miyf: INFO
    org.testcontainers: INFO
