# Docker 运行配置（由 Compose 注入环境变量）
spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

server:
  forward-headers-strategy: framework

# 宿主机挂载：/miyf/log/server → 容器 /miyf/log/server（按日 .gz）
logging:
  file:
    path: ${LOG_PATH:/miyf/log/server}
  level:
    cn.miyf: INFO
