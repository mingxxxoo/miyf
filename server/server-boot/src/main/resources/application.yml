spring:
  application:
    name: miyf
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # Boot 4 默认 tools.jackson；业务 ObjectMapper 见 JacksonConfig（com.fasterxml）
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 客户端固定 Lettuce（Boot 默认，不使用 Jedis）
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_LETTUCE_MAX_ACTIVE:16}
          max-idle: ${REDIS_LETTUCE_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_MIN_IDLE:2}
          max-wait: ${REDIS_LETTUCE_MAX_WAIT:3s}
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mybatis-plus:
  # 复杂 SQL 统一放 mapper XML，禁止用 Wrapper 拼装联表/动态分页/聚合
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.miyf.bean.entity,cn.miyf.kitchen.bean.entity,cn.miyf.health.bean.entity,cn.miyf.notification.entity,cn.miyf.job.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id

app:
  id:
    worker-id: ${APP_ID_WORKER_ID:1}
    datacenter-id: ${APP_ID_DATACENTER_ID:1}
  database-type: ${DATABASE_TYPE:postgresql}
  datasource:
    primary:
      enabled: true
      type: ${DATABASE_TYPE:postgresql}
      url: ${PRIMARY_DB_URL:jdbc:postgresql://localhost:5432/miyf}
      username: ${PRIMARY_DB_USERNAME:postgres}
      password: ${PRIMARY_DB_PASSWORD:change-me}
      driver-class-name: org.postgresql.Driver
      pool-name: miyf-primary
      minimum-idle: 2
      maximum-pool-size: 20
    secondary:
      enabled: ${SECONDARY_DB_ENABLED:false}
      type: ${SECONDARY_DB_TYPE:mysql}
      url: ${SECONDARY_DB_URL:}
      username: ${SECONDARY_DB_USERNAME:}
      password: ${SECONDARY_DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: miyf-secondary
      minimum-idle: 1
      maximum-pool-size: 10
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
    cache:
      category-ttl-seconds: ${REDIS_CACHE_CATEGORY_TTL:600}
      hot-dish-ttl-seconds: ${REDIS_CACHE_HOT_DISH_TTL:300}
      empty-ttl-seconds: ${REDIS_CACHE_EMPTY_TTL:60}
      tree-ttl-seconds: ${REDIS_CACHE_TREE_TTL:600}
      object-ttl-seconds: ${REDIS_CACHE_OBJECT_TTL:300}
    rate-limit:
      enabled: ${REDIS_RATE_LIMIT_ENABLED:true}
      login-max-attempts: ${REDIS_LOGIN_MAX_ATTEMPTS:10}
      login-window-seconds: ${REDIS_LOGIN_WINDOW_SECONDS:300}
      api-max-requests: ${REDIS_API_MAX_REQUESTS:120}
      api-window-seconds: ${REDIS_API_WINDOW_SECONDS:60}
    lock:
      default-lease-seconds: ${REDIS_LOCK_LEASE_SECONDS:10}
  file-storage:
    type: ${FILE_STORAGE_TYPE:minio}
    path: ${FILE_STORAGE_PATH:./uploads}
    base-url: ${FILE_STORAGE_BASE_URL:http://localhost:9000/miyf}
    max-size-bytes: ${FILE_STORAGE_MAX_SIZE_BYTES:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    endpoint: ${FILE_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${FILE_STORAGE_BUCKET:miyf}
    access-key: ${FILE_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${FILE_STORAGE_SECRET_KEY:minioadmin}
    region: ${FILE_STORAGE_REGION:}
    auto-create-bucket: ${FILE_STORAGE_AUTO_CREATE_BUCKET:true}
    public-read: ${FILE_STORAGE_PUBLIC_READ:true}
  security:
    # 是否放行 Swagger；生产 profile 关闭
    expose-docs: ${APP_SECURITY_EXPOSE_DOCS:true}
  health:
    enabled: ${APP_HEALTH_ENABLED:true}
    sync:
      # 健康远程数据源定时同步（HealthSyncJob）；可在 /system/jobs 启停
      cron: ${APP_HEALTH_SYNC_CRON:0 15 * * * *}
    providers:
      example:
        enabled: ${APP_HEALTH_PROVIDER_EXAMPLE_ENABLED:false}
      huawei:
        enabled: ${APP_HEALTH_PROVIDER_HUAWEI_ENABLED:false}
    huawei:
      mock-enabled: ${APP_HEALTH_HUAWEI_MOCK:true}
      client-id: ${HUAWEI_HEALTH_CLIENT_ID:}
      client-secret: ${HUAWEI_HEALTH_CLIENT_SECRET:}
      redirect-uri: ${HUAWEI_HEALTH_REDIRECT_URI:http://localhost:5173/health/providers}
      authorize-url: https://oauth-login.cloud.huawei.com/oauth2/v3/authorize
      token-url: https://oauth-login.cloud.huawei.com/oauth2/v3/token
      health-api-base: https://health-api.cloud.huawei.com/healthkit/v1
  notification:
    mail:
      enabled: ${APP_NOTIFICATION_MAIL_ENABLED:false}
      from: ${APP_NOTIFICATION_MAIL_FROM:noreply@miyf.local}
    sms:
      enabled: ${APP_NOTIFICATION_SMS_ENABLED:false}
      provider: ${APP_NOTIFICATION_SMS_PROVIDER:logging}
  search:
    # 默认关闭；开启需本地/compose 启动 Elasticsearch
    enabled: ${APP_SEARCH_ENABLED:false}
    index-prefix: ${APP_SEARCH_INDEX_PREFIX:miyf}
    uris:
      - ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connect-timeout-ms: ${APP_SEARCH_CONNECT_TIMEOUT_MS:3000}
    socket-timeout-ms: ${APP_SEARCH_SOCKET_TIMEOUT_MS:10000}

wx:
  auth:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    mock-enabled: ${WX_AUTH_MOCK_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    cn.miyf: INFO
